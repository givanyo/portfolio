<div [class]="'project ' + project().orientation">
  <img [src]="'/images/' + project().imgPath" [alt]="project().title" />
  <h3>{{ project().title }}</h3>
  <p>{{ project().description }}</p>
  <div class="buttons">
    <app-button
      [button]="{
        color: 'purple',
        text: buttonText,
        fontSize: 'md',
        displaySvg: true,
        link: project().liveWebsiteLink || project().githubLink
      }"
    >
    </app-button>
  </div>
</div>
