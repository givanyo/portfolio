<section>
  <p class="section-title">Tecnologias & Ferramentas</p>
  <div class="cards">
    @for (card of sortedCards; track card.id) {
      <app-card [cardInfo]="card"></app-card>
    }
  </div>
  <app-button
    [button]="{
      text: 'ver todas as tecnologias',
      fontSize: 'md',
      color: 'purple',
      displaySvg: true,
    }"
  ></app-button>
</section>
